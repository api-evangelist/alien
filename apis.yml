aid: alien
name: Alien
description: >-
  Alien is a proof-of-humanity protocol with its own Layer 1 blockchain that
  verifies users are real, unique humans without storing biometrics, documents,
  or personal data — retaining only cryptographic proofs, hashes, and Merkle
  roots via its Continuous Human Verification Protocol (CHVP). For developers,
  Alien ships Alien SSO: a standard OpenID Connect / OAuth 2.0 identity provider
  (authorization code + PKCE, DPoP-bound tokens) that lets apps offer "Sign in
  with Alien ID" so users prove personhood without sharing name or email. It also
  provides Alien Agent ID (Ed25519 cryptographic identity linking AI agents to a
  verified human owner), a Mini Apps SDK, Solana wallet-linking attestations, and
  first-party JavaScript/React/Python SDKs plus a CLI. Backed by Initialized
  Capital.
